<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Veltrix Nova</title><desc id="desc">Liquid-glass V emblem with a violet-to-cyan orbit and luminous orb, framed by glowing glass ribbons.</desc>
<defs>
 <radialGradient id="back" cx="50%" cy="45%" r="75%"><stop stop-color="#10163a"/><stop offset=".6" stop-color="#050817"/><stop offset="1" stop-color="#02040b"/></radialGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9a5ff"/><stop offset=".28" stop-color="#7850ff"/><stop offset=".65" stop-color="#327dff"/><stop offset="1" stop-color="#36f2ff"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f5c5ff"/><stop offset=".2" stop-color="#9256ff"/><stop offset=".48" stop-color="#263eff"/><stop offset=".72" stop-color="#11baff"/><stop offset="1" stop-color="#7afaff"/></linearGradient>
 <linearGradient id="orbit" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#d78cff"/><stop offset=".45" stop-color="#8056ff"/><stop offset=".75" stop-color="#31c9ff"/><stop offset="1" stop-color="#68f8ff"/></linearGradient>
 <radialGradient id="orb" cx="30%" cy="25%" r="80%"><stop stop-color="#fff"/><stop offset=".15" stop-color="#c9a0ff"/><stop offset=".48" stop-color="#465aff"/><stop offset=".76" stop-color="#08cfff"/><stop offset="1" stop-color="#153b9e"/></radialGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="1200" rx="0" fill="url(#back)"/>
<!-- Glass ribbons run along the image edges, rather than forming an inset app tile. -->
<g fill="none" stroke-linecap="round" filter="url(#glow)">
 <path d="M-60 250 C80 70 260 35 470 55 L760 55 C970 45 1120 120 1260 275" stroke="url(#rim)" stroke-width="26" opacity=".82"/>
 <path d="M-80 930 C100 1115 265 1160 480 1145 L755 1145 C960 1160 1110 1085 1280 900" stroke="url(#rim)" stroke-width="30" opacity=".85"/>
 <path d="M-35 310 C35 190 100 125 220 82" stroke="#9d72ff" stroke-width="12" opacity=".7"/>
 <path d="M1235 300 C1170 190 1100 120 990 78" stroke="#38eaff" stroke-width="12" opacity=".75"/>
</g>
<g filter="url(#glow)">
 <path d="M290 330 Q280 300 325 300 L430 300 Q450 300 465 330 L600 585 L740 335 Q755 305 785 305 L895 305 Q925 305 910 340 L700 790 Q660 875 600 875 Q550 875 505 790Z" fill="url(#glass)" stroke="url(#rim)" stroke-width="9" stroke-linejoin="round"/>
 <path d="M312 319 Q345 310 375 324 L585 682 Q604 717 622 683 L770 365 Q784 338 815 330" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="8" stroke-linecap="round"/>
 <ellipse cx="600" cy="595" rx="365" ry="115" transform="rotate(-19 600 595)" fill="none" stroke="url(#orbit)" stroke-width="24"/>
 <ellipse cx="600" cy="595" rx="365" ry="115" transform="rotate(-19 600 595)" fill="none" stroke="#e6faff" stroke-opacity=".65" stroke-width="4"/>
 <circle cx="835" cy="270" r="65" fill="url(#orb)" stroke="url(#rim)" stroke-width="8"/>
 <circle cx="816" cy="249" r="15" fill="#fff" opacity=".85" filter="url(#soft)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="500" letter-spacing="18" text-anchor="middle">
 <text x="600" y="1010" fill="#b78cff">VELTRIX <tspan fill="#4feaff">NOVA</tspan></text>
</g>
</svg>
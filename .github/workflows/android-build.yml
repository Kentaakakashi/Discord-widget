name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/social-sdk-rich-presence" ]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Accept licenses and install Android toolchains
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.14.4/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Print APK signing certificate fingerprints
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "Signing certificate fingerprints for this exact APK:"
          "$APKSIGNER" verify --print-certs "$APK"
          echo ""
          echo "IMPORTANT: GitHub-hosted runners may generate a different debug signing key on later builds."
          echo "Use this SHA-1 for the APK from this run only unless a stable signing key is configured."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeltrixNova-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
